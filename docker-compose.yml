  #     NEXT_PUBLIC_MOCK_DATA: ${NEXT_PUBLIC_MOCK_DATA}
  #   command: service nginx start && yarn start
  #   ports:
  #     - "4000:3001"
  #     - "4080:80"
  #   networks:
  #     - globalyapp

  backend:
    container_name: globalyapp-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: globalyapp-backend:local
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started
      lavinmq:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/globalyapp/backend
      - /globalyapp/backend/node_modules
    networks:
      - globalyapp

