      - "5672:5672"
    networks:
      - globalyapp
    deploy:
      resources:
        limits:
          memory: 512m

  dragonfly:
    container_name: globalyapp-dragonfly
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    ports:
      - "6379:6379"
    volumes:
      - dragonfly-data:/data
    networks:
      - globalyapp
    deploy:
      resources:
        limits:
          memory: 3g

  mailpit:
    container_name: globalyapp-mailpit
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - globalyapp
    deploy:
      resources:
        limits:
          memory: 256m

  scrapling-mcp:
    build:
      context: ./devops/docker/scrapling
      args:
        # Replace with your own generated value in .env, e.g. `openssl rand -hex 32`.
        SCRAPLING_MCP_AUTH_TOKEN: ${SCRAPLING_MCP_AUTH_TOKEN}
    image: globalyapp-scrapling-mcp:local
    container_name: scrapling-mcp
    restart: unless-stopped
    # The image ships regular Playwright's Chromium but NOT Patchright's — the
    # separate, patched build that stealthy_fetch/bulk_stealthy_fetch actually launch
    # for anti-bot bypass. Without it every stealthy_fetch call fails immediately
    # ("BrowserType.launch_persistent_context: Executable doesn't exist at
    # .../chromium-1228/..."), silently degrading our 3-tier cascade (get →
    # stealthy_fetch → fetch) down to the two weakest tiers — real bug, confirmed
    # live: 0/385 pages in job b373143d succeeded via Scrapling, 100% fell through
    # to Firecrawl. `patchright install` is idempotent (no-op if already present),
    # so running it before every start self-heals if the browsers-cache volume is
    # ever wiped, without re-downloading on a normal restart.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        uv run patchright install chromium &&
        uv run scrapling mcp --http --host 0.0.0.0 --port 8000
        --allowed-host localhost:8000 --allowed-host localhost:8123
      # Add every hostname/port clients will use to reach this server, e.g.:
      # --allowed-host scrapling.internal.example.com:8000
    ports:
      - "8123:8000"
    # environment:
      # Optional: only needed if you want a non-bundled Chromium build
      # SCRAPLING_EXECUTABLE_PATH: /path/to/chromium
    volumes:
      # Persists both Playwright's and Patchright's downloaded browser builds across
      # container recreation — without this, every fresh container re-downloads
      # ~300MB before stealthy_fetch can serve its first request.
      - scrapling-browsers:/root/.cache/ms-playwright
    # Chromium needs more than Docker's default 64MB /dev/shm or it crashes
    # under load (dynamic/stealthy fetch tools spawn real browser tabs).
    shm_size: "1gb"
    # Alternative to shm_size on older compose versions:
    # tmpfs:
    #   - /dev/shm:size=1g
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      # Scrapling's docs don't document a /health route, so this just
      # checks the port is accepting connections rather than assuming
      # an endpoint exists. Swap for a real check if one turns out to exist.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  globalyapp:
    name: globalyapp

volumes:
  dragonfly-data:
  scrapling-browsers:
