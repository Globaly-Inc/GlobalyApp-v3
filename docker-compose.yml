services:
  postgres:
    container_name: globalyapp-postgres
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./.docker/storage/postgres:/var/lib/postgresql/data
    networks:
      - globalyapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g

  frontend-dev:
    container_name: globalyapp-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_MOCK_DATA: ${NEXT_PUBLIC_MOCK_DATA}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_MOCK_DATA: ${NEXT_PUBLIC_MOCK_DATA}
    # command: tail -f /dev/null
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/globalyapp/frontend
      - /globalyapp/frontend/node_modules
    networks:
      - globalyapp

  # frontend:
  #   container_name: globalyapp-frontend
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #     args:
  #       NEXT_PUBLIC_MOCK_DATA: ${NEXT_PUBLIC_MOCK_DATA}
  #       NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  #   env_file:
  #     - ./frontend/.env
  #   environment:
