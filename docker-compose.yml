services:
  postgres:
    container_name: globalyapp-postgres
    # pgvector build of postgres 17 — superadmin migration 20260811_001 needs the
    # `vector` type (CREATE EXTENSION vector) for extraction_memory embeddings.
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./.docker/storage/postgres:/var/lib/postgresql/data
    networks:
      - globalyapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g

  # The integration-test database. It existed only as a hand-created `docker run`
  # container (v3-test-db on 5460) until 2026-08-18, which meant its configuration
  # was not reproducible and every per-agent test database vanished with it.
  #
  # shm_size is the reason this is written down. Docker defaults /dev/shm to 64M;
  # Postgres allocates dynamic shared memory there for parallel query workers, and
  # with many concurrent test databases w6-storage-rewrite.test.ts failed with
  # "could not resize shared memory segment: No space left on device" — an
  # environment failure that reads exactly like a code failure. 256M plus
  # max_parallel_workers_per_gather=0 removes both the pressure and the need for it;
  # tests gain nothing from parallel query.
  #
  # Not started by default: `docker compose up test-db` when you need it, and note
  # it claims 5460, so stop any hand-created v3-test-db first.
  test-db:
    container_name: v3-test-db
    image: pgvector/pgvector:pg17
    profiles: ["test"]
    ports:
      - "5460:5432"
    environment:
      POSTGRES_DB: globalyapp_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    shm_size: 256m
    command:
      - postgres
      - -c
      - max_parallel_workers_per_gather=0
    networks:
      - globalyapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d globalyapp_test"]
      interval: 5s
      retries: 10

  frontend-dev:
    container_name: globalyapp-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_MOCK_DATA: ${NEXT_PUBLIC_MOCK_DATA}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_MOCK_DATA: ${NEXT_PUBLIC_MOCK_DATA}
    # command: tail -f /dev/null
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/globalyapp/frontend
      - /globalyapp/frontend/node_modules
    networks:
      - globalyapp

  # frontend:
  #   container_name: globalyapp-frontend
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #     args:
  #       NEXT_PUBLIC_MOCK_DATA: ${NEXT_PUBLIC_MOCK_DATA}
  #       NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  #   env_file:
  #     - ./frontend/.env
  #   environment:
  #     NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  #     NEXT_PUBLIC_MOCK_DATA: ${NEXT_PUBLIC_MOCK_DATA}
  #   command: service nginx start && yarn start
  #   ports:
  #     - "4000:3001"
  #     - "4080:80"
  #   networks:
  #     - globalyapp

  backend:
    container_name: globalyapp-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: globalyapp-backend:local
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      lavinmq:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/globalyapp/backend
      - /globalyapp/backend/node_modules
    networks:
      - globalyapp

  auth-worker:
    container_name: globalyapp-auth-worker
    image: globalyapp-backend:local
    command: npm run job:auth
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      lavinmq:
        condition: service_started
    volumes:
      - ./backend:/globalyapp/backend
      - /globalyapp/backend/node_modules
    networks:
      - globalyapp

  business-claim-requests-worker:
    container_name: globalyapp-business-claim-requests-worker
    image: globalyapp-backend:local
    command: npm run job:business-claim-requests
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      lavinmq:
        condition: service_started
    volumes:
      - ./backend:/globalyapp/backend
      - /globalyapp/backend/node_modules
    networks:
      - globalyapp

  extraction-worker:
    container_name: globalyapp-extraction-worker
    image: globalyapp-backend:local
    profiles: ["globalyapp-extraction"]
    command: npm run job:extraction
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      lavinmq:
        condition: service_started
    volumes:
      - ./backend:/globalyapp/backend
      - /globalyapp/backend/node_modules
    networks:
      - globalyapp

  extraction-pages-worker:
    container_name: globalyapp-extraction-pages-worker
    image: globalyapp-backend:local
    profiles: ["globalyapp-extraction-pages"]
    command: npm run job:extraction-pages
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      lavinmq:
        condition: service_started
    volumes:
      - ./backend:/globalyapp/backend
      - /globalyapp/backend/node_modules
    networks:
      - globalyapp

  extraction-verify-worker:
    container_name: globalyapp-extraction-verify-worker
    image: globalyapp-backend:local
    profiles: ["globalyapp-extraction-verify"]
    command: npm run job:extraction-verify
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      lavinmq:
        condition: service_started
    volumes:
      - ./backend:/globalyapp/backend
      - /globalyapp/backend/node_modules
    networks:
      - globalyapp

  extraction-step-worker:
    container_name: globalyapp-extraction-step-worker
    image: globalyapp-backend:local
    profiles: ["globalyapp-extraction-step"]
    command: npm run job:extraction-step
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      lavinmq:
        condition: service_started
    volumes:
      - ./backend:/globalyapp/backend
      - /globalyapp/backend/node_modules
    networks:
      - globalyapp

  extraction-schedule-worker:
    container_name: globalyapp-extraction-schedule-worker
    image: globalyapp-backend:local
    profiles: ["globalyapp-extraction-schedule"]
    # --every makes this a real periodic trigger. Without it the one-shot exits
    # immediately and, with no restart policy, the container never runs again --
    # which was the actual gap behind master-plan 3.4 "Scheduler trigger".
    # Overlap across replicas is prevented by a Postgres advisory lock, not by
    # this being a singleton; see services/schedule.service.ts.
    command: npm run job:extraction-schedule -- --every=60
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      lavinmq:
        condition: service_started
    volumes:
      - ./backend:/globalyapp/backend
      - /globalyapp/backend/node_modules
    networks:
      - globalyapp

  extraction-agentcis-worker:
    container_name: globalyapp-extraction-agentcis-worker
    image: globalyapp-backend:local
    profiles: ["globalyapp-extraction-agentcis"]
    command: npm run job:extraction-agentcis
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      lavinmq:
        condition: service_started
    volumes:
      - ./backend:/globalyapp/backend
      - /globalyapp/backend/node_modules
    networks:
      - globalyapp

  lavinmq:
    container_name: globalyapp-lavinmq
    image: cloudamqp/lavinmq:2.4
    ports:
      - "15672:15672"
      - "5672:5672"
    networks:
      - globalyapp
    deploy:
      resources:
        limits:
          memory: 512m

  mailpit:
    container_name: globalyapp-mailpit
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - globalyapp
    deploy:
      resources:
        limits:
          memory: 256m

networks:
  globalyapp:
    name: globalyapp
