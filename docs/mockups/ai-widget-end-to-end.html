<!doctype html>
<html lang="en" style="color-scheme:light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Widget Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* GlobalyApp tokens (frontend/src/app/globals.css). Light only: the product has no dark theme. */
:root{
  --bg:hsl(210 20% 99%); --card:#fff; --fg:hsl(222 47% 11%); --muted:hsl(210 17% 96%); --muted-fg:hsl(215 16% 47%);
  --border:hsl(215 16% 90%); --primary:#012E8A; --primary-soft:hsl(220 86% 95%); --primary-10:hsl(222 35% 92%);
  --aqua:hsl(187 85% 32%); --aqua-soft:hsl(187 92% 94%); --sky:hsl(204 90% 95%); --sky-b:hsl(204 80% 82%); --sky-fg:hsl(204 80% 28%);
  --ok:hsl(152 60% 30%); --ok-soft:hsl(152 60% 94%); --warn:hsl(32 90% 32%); --warn-soft:hsl(40 90% 93%);
  --bad:hsl(0 84% 60%); --bad-soft:hsl(0 84% 96%); --radius:10px;
  --brand:#012E8A; /* the widget's brand colour — the Branding step changes it */
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.serif{font-family:"Fraunces",Georgia,serif;letter-spacing:-.01em}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* ---------- journey bar ---------- */
.jhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--border)}
.jtitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.jtitle h1{font-family:"Fraunces",Georgia,serif;font-size:22px;font-weight:600}
.legend{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted-fg);margin-left:auto;flex-wrap:wrap}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.step{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 10px 5px 5px;font-size:12px;cursor:pointer;white-space:nowrap}
.step b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 10.5px/1 "Inter";background:var(--muted);color:var(--muted-fg)}
.step.on{border-color:var(--primary);background:var(--primary);color:#fff}
.step.on b{background:#fff;color:var(--primary)}
.step.done b{background:var(--ok-soft);color:var(--ok)}
.step .grp{font-size:10px;color:var(--muted-fg)}
.step.on .grp{color:hsl(220 60% 85%)}
.navrow{display:flex;gap:8px;align-items:center}
.navrow .sp{flex:1}
.kbd{font:500 11px/1 "Geist Mono";border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--muted-fg);background:var(--card)}

/* ---------- scene layout ---------- */
.scene{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.scene{grid-template-columns:1fr}}
.stage{min-width:0;display:flex;flex-direction:column;gap:12px}
.notes{position:sticky;top:120px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;font-size:13px}
@media (max-width:1100px){.notes{position:static}}
.notes h2{font-family:"Fraunces",Georgia,serif;font-size:18px;font-weight:600}
.notes h4{margin:0;font:600 10.5px/1 "Inter";letter-spacing:.08em;text-transform:uppercase;color:var(--muted-fg)}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.notes .try{background:var(--primary-soft);color:var(--primary);border-radius:8px;padding:8px 10px}

/* ---------- shared UI ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--fg);transition:background .15s,transform .1s}
.btn:hover{background:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:hsl(220 99% 22%)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--muted)}
.btn.dash{border-style:dashed}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500;white-space:nowrap}
.p-ai{background:var(--primary-soft);color:var(--primary)}
.p-h{background:var(--aqua-soft);color:var(--aqua)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:hsl(0 70% 42%)}
.p-mute{background:var(--muted);color:var(--muted-fg)}
.planned{font:600 9.5px/1 "Inter";letter-spacing:.04em;text-transform:uppercase;color:hsl(270 60% 45%);background:hsl(270 80% 96%);border:1px dashed hsl(270 50% 75%);border-radius:4px;padding:3px 5px;white-space:nowrap}
.today{font:600 9.5px/1 "Inter";letter-spacing:.04em;text-transform:uppercase;color:var(--ok);background:var(--ok-soft);border-radius:4px;padding:3px 5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px}
.label{font:600 11px/1 "Inter";letter-spacing:.08em;text-transform:uppercase;color:var(--muted-fg)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center}
.field small{color:var(--muted-fg);font-size:12px}
.input,.textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font:inherit;background:var(--card);color:var(--fg)}
.input{height:40px}
.textarea{resize:vertical;min-height:70px}
.input.err{border-color:var(--bad)}
.errtxt{color:hsl(0 70% 45%);font-size:12px}
.toggle{width:36px;height:20px;border-radius:999px;background:var(--border);position:relative;border:0;cursor:pointer;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .2s}
.toggle[aria-checked="true"]{background:var(--primary)}
.toggle[aria-checked="true"]::after{left:18px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font:600 11.5px/1 "Inter";background:var(--primary-soft);color:var(--primary);position:relative}
.av.sm{width:24px;height:24px;font-size:9.5px}
.av.agent{background:var(--sky);color:var(--sky-fg)}
.av .bdg{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:7.5px;color:#fff;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--fg);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(15,23,42,.25);transition:all .25s;z-index:100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- GlobalyApp shell ---------- */
.appframe{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 1px 2px rgba(15,23,42,.04)}
.appscroll{overflow-x:auto}
.shell{display:grid;grid-template-columns:68px minmax(0,1fr);grid-template-rows:54px auto;min-width:1000px}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border)}
.logo{width:32px;height:32px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;font:700 17px/1 "Inter"}
.org{display:flex;align-items:center;gap:8px;font-weight:600}
.org span{color:var(--muted-fg);font-weight:400}
.topbar .sp{flex:1}
.credits{font-size:12px;color:var(--muted-fg);border:1px solid var(--border);border-radius:999px;padding:5px 11px}
.me{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.rail{border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;padding:8px 7px}
.rail a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted-fg);text-decoration:none;padding:7px 2px;border-radius:10px;cursor:pointer}
.rail a i{font-style:normal;font-size:15px;line-height:1}
.rail a.on{background:var(--primary-soft);color:var(--primary)}
.content{min-width:0;background:var(--bg);position:relative}
.page{padding:24px 28px;display:flex;flex-direction:column;gap:18px;max-width:1000px;margin:0 auto}
.pagehead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pagehead h2{font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.pagehead p{color:var(--muted-fg)}
.pagehead .sp{flex:1}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border)}
.tabs button{border:0;background:none;padding:8px 12px;font-size:13px;color:var(--muted-fg);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}

/* ---------- wizard ---------- */
.wiz{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:0;min-height:640px}
.wiz-form{padding:22px 26px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--border);background:var(--card)}
.wiz-steps{display:flex;gap:4px;flex-wrap:wrap}
.wiz-steps span{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--muted);color:var(--muted-fg)}
.wiz-steps span.on{background:var(--primary);color:#fff}
.wiz-steps span.done{background:var(--ok-soft);color:var(--ok)}
.wiz-prev{background:linear-gradient(160deg,hsl(220 40% 97%),hsl(210 30% 94%));position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:18px}
.wiz-prev .cap{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted-fg)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:28px;height:28px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px var(--border);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--fg)}
.chipsedit{display:flex;flex-wrap:wrap;gap:6px}
.chipsedit span{border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:12px;background:var(--card);display:inline-flex;gap:6px;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13px}
.radio label.on{border-color:var(--primary);background:var(--primary-soft)}
.radio input{margin-top:3px;accent-color:var(--primary)}
.codebox{background:hsl(222 47% 11%);color:hsl(210 40% 92%);border-radius:10px;padding:14px 16px;font:12.5px/1.6 "Geist Mono",monospace;overflow-x:auto;position:relative}
.codebox .k{color:hsl(187 80% 65%)}.codebox .s{color:hsl(40 90% 70%)}
.install-tabs{display:flex;gap:4px}
.install-tabs button{border:1px solid var(--border);background:var(--card);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.install-tabs button.on{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.checkrow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--primary);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:6px;border-radius:999px;background:var(--muted);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:999px}

/* ---------- external website ---------- */
.browser{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 12px 40px rgba(15,23,42,.08)}
.chrome{display:flex;align-items:center;gap:10px;padding:8px 12px;background:hsl(210 17% 95%);border-bottom:1px solid var(--border)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:hsl(0 70% 70%)}.dots i:nth-child(2){background:hsl(40 85% 62%)}.dots i:nth-child(3){background:hsl(140 45% 58%)}
.addr{flex:1;background:#fff;border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--muted-fg);display:flex;gap:6px;align-items:center}
.viewport{position:relative;height:680px;overflow:hidden;background:#fff}
.site{height:100%;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:#1d2433}
.site-nav{display:flex;align-items:center;gap:22px;padding:16px 32px;border-bottom:1px solid #e8e3d8;font-family:"Inter",sans-serif;font-size:13px}
.site-nav .crest{width:34px;height:34px;border-radius:6px;background:#7a1f2b;color:#f5e9d6;display:grid;place-items:center;font:700 16px/1 Georgia}
.site-nav b{font-family:Georgia,serif;font-size:17px}
.site-nav .sp{flex:1}
.site-nav a{color:#39404f;text-decoration:none}
.site-hero{padding:56px 32px 36px;background:linear-gradient(120deg,#f6f1e7,#efe6d6);display:grid;grid-template-columns:1.2fr 1fr;gap:28px}
.site-hero h3{font-size:40px;line-height:1.1;font-weight:400}
.site-hero p{font-family:"Inter",sans-serif;color:#4a5263;margin-top:12px;max-width:44ch}
.site-hero .cta{margin-top:18px;display:inline-block;background:#7a1f2b;color:#fff;font:600 13px "Inter";padding:10px 16px;border-radius:4px}
.site-hero .img{border-radius:6px;background:linear-gradient(160deg,#c9b89a,#8c7a5c);min-height:190px;position:relative}
.site-hero .img::after{content:"Admissions Hall";position:absolute;left:12px;bottom:10px;color:#fff;font:italic 13px Georgia;opacity:.8}
.site-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:28px 32px}
.site-cols div{border-top:2px solid #7a1f2b;padding-top:10px}
.site-cols h4{margin:0 0 6px;font-size:17px;font-weight:400}
.site-cols p{font-family:"Inter",sans-serif;font-size:12.5px;color:#5a6172}

/* ---------- phone ---------- */
.phones{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;padding:12px}
.phone{width:320px;height:640px;border-radius:40px;border:10px solid hsl(222 30% 16%);background:#fff;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(15,23,42,.18);flex:none}
.phone .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:110px;height:22px;background:hsl(222 30% 16%);border-radius:0 0 14px 14px;z-index:30}
.phone .site-nav{padding:30px 16px 12px;gap:10px}
.phone .site-nav a{display:none}
.phone .site-hero{grid-template-columns:1fr;padding:26px 16px}
.phone .site-hero h3{font-size:26px}
.phone .site-cols{grid-template-columns:1fr;padding:16px}

/* ---------- widget ---------- */
.w-layer{position:absolute;inset:0;pointer-events:none;z-index:20}
.w-layer > *{pointer-events:auto}
.w-orb{position:absolute;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 30% 30%,#fff 0,color-mix(in srgb,var(--brand) 55%,#fff) 28%,var(--brand) 70%);box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 45%,transparent),0 0 0 0 color-mix(in srgb,var(--brand) 40%,transparent);animation:orbPulse 2.6s ease-out infinite;transition:transform .2s}
.w-orb:hover{transform:scale(1.06)}
.w-orb.open{animation:none;transform:rotate(90deg) scale(.92)}
.w-orb svg{width:24px;height:24px;color:#fff}
.w-orb .dot{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font:700 10px/18px "Inter";border:2px solid #fff}
@keyframes orbPulse{0%{box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 45%,transparent),0 0 0 0 color-mix(in srgb,var(--brand) 35%,transparent)}70%{box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 45%,transparent),0 0 0 16px transparent}100%{box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 45%,transparent),0 0 0 0 transparent}}
.w-left .w-orb{right:auto;left:22px}.w-left .w-panel{right:auto;left:20px;transform-origin:bottom left}.w-left .w-teaser{right:auto;left:92px}
.w-teaser{position:absolute;right:92px;bottom:30px;max-width:230px;background:#fff;border:1px solid var(--border);border-radius:14px 14px 4px 14px;padding:10px 12px;font:13px/1.4 "Inter";color:var(--fg);box-shadow:0 8px 24px rgba(15,23,42,.12);animation:teaseIn .5s ease-out both;cursor:pointer}
.w-teaser .x{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;border:1px solid var(--border);background:#fff;font-size:11px;cursor:pointer;display:grid;place-items:center}
@keyframes teaseIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.w-panel{position:absolute;right:20px;bottom:92px;width:380px;height:min(600px,calc(100% - 112px));background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(15,23,42,.22),0 0 0 1px rgba(15,23,42,.06);display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right;transform:scale(.6) translateY(30px);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.2,.9,.3,1.2),opacity .2s,width .3s,height .3s,right .3s,bottom .3s,border-radius .3s;font-family:"Inter",sans-serif}
.w-panel.open{transform:none;opacity:1;pointer-events:auto}
.w-panel.full{right:0;bottom:0;width:100%;height:100%;border-radius:0}
.phone .w-panel.open{right:0;bottom:0;width:100%;height:100%;border-radius:0;padding-top:30px}
/* The status bar / notch: a full-screen sheet starts below it (env(safe-area-inset-top) on a real phone). */
.phone .w-panel.open .w-head::before{top:30px}
/* On a phone the sheet covers the launcher's spot; the header's minimise button closes it instead. */
.phone .w-orb.open{opacity:0;pointer-events:none;transform:scale(.6)}
.phone .w-foot{padding-bottom:16px}
.phone .w-orb{right:14px;bottom:14px;width:52px;height:52px}
.phone .w-teaser{right:76px;bottom:20px}
.w-head{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-bottom:1px solid var(--border);position:relative}
.w-head::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--brand)}
.w-logo{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font:700 14px Georgia;flex:none;position:relative}
.w-logo.agent{background:var(--sky);color:var(--sky-fg);font:600 12px "Inter";border-radius:50%}
.w-logo .live{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:hsl(142 70% 45%);border:2px solid #fff}
.w-head .t{min-width:0;flex:1}
.w-head .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-head .t small{display:block;color:var(--muted-fg);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-ico{width:30px;height:30px;border-radius:8px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted-fg);font-size:14px}
.w-ico:hover{background:var(--muted);color:var(--fg)}
.w-body{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;background:#fff;scroll-behavior:smooth}
.w-banner{font-size:12px;padding:7px 12px;display:flex;gap:8px;align-items:center}
.w-banner.off{background:var(--warn-soft);color:var(--warn)}
.w-banner.bad{background:var(--bad-soft);color:hsl(0 70% 40%)}
.w-banner.h{background:var(--aqua-soft);color:var(--aqua)}
.w-welcome{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:14px 8px 4px}
.w-welcome .w-logo{width:48px;height:48px;font-size:19px;border-radius:14px}
.w-welcome h5{margin:0;font-size:16px}
.w-welcome p{color:var(--muted-fg);font-size:13px}
.m{display:flex;gap:8px;max-width:100%;animation:msgIn .25s ease-out both}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.u{justify-content:flex-end}

<div class="wrap">

<script>
(function () {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const now = () => new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200); }

/* ============ shared config (the widget being built) ============ */
const CFG = {
  name: "Northfield Admissions", subtitle: "Usually replies in seconds",
  greeting: "Hi! I'm Northfield's admissions assistant. Ask me about courses, entry requirements, fees or scholarships.",
  brand: "#7a1f2b", logo: "N", position: "right",
  instructions: "Always mention our February and July intakes. Recommend booking a campus tour for undergraduates.",
  limit: 1000, used: 184,
  starters: ["What Masters courses do you offer?", "What IELTS score do I need?", "Are there scholarships?"],
  contactAfter: 2, handoff: true, hours: "Mon–Fri, 9am–5pm",
};
const BRANDS = ["#7a1f2b", "#012E8A", "#0f766e", "#7c3aed", "#c2410c", "#111827"];
const AGENT = { name: "Alex Morgan", first: "Alex", ini: "AM" };
/* End-of-chat rating: five faces, worst to best. A low score asks what went wrong. */
const RATINGS = [["😞", "Very unhappy"], ["🙁", "Unhappy"], ["😐", "Okay"], ["🙂", "Happy"], ["😍", "Loved it"]];
function applyBrand() { document.documentElement.style.setProperty("--brand", CFG.brand); }

/* ============ widget engine (visitor side) ============ */
const W = {};
function wReset(o = {}) {
  const gen = (W.gen || 0) + 1;
  Object.assign(W, { gen, open: false, full: false, teaser: true, msgs: [], mode: "ai", typing: null, contact: "none", sent: 0,
    endShown: false, ended: false, rating: null, ratingDone: false, ratingNote: "", unread: 0, offline: false, returning: false, draft: "", agentTyping: false }, o);
}
wReset();
let seq = 1;
const M = (who, text, extra = {}) => ({ id: seq++, who, text, at: now(), ...extra });

const ICON = {
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  send: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>',
};

function wMsgHTML(m) {
  if (m.who === "sys") return `<div class="sysline">${esc(m.text)}</div>`;
  if (m.who === "u") {
    const st = m.state === "sending" ? `<div class="st">Sending…</div>` : m.state === "failed"
      ? `<div class="st fail">Not sent · <button type="button" data-retry="${m.id}">Retry</button></div>` : "";
    return `<div class="m u"><div style="display:flex;flex-direction:column;align-items:flex-end;max-width:80%"><div class="bb" style="max-width:100%">${esc(m.text)}</div>${st}</div></div>`;
  }
  if (m.who === "g") return `<div class="m g"><div class="av sm agent">${AGENT.ini}</div><div style="max-width:84%"><div class="who"><b>${AGENT.first}</b> · Admissions team</div><div class="bb" style="max-width:100%">${esc(m.text)}</div></div></div>`;
  if (m.who === "card") return wCardHTML(m);
  const paras = m.text.split("\n").map((p) => `<p>${p.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")}</p>`).join("");
  const courses = m.courses ? `<div class="courses">${m.courses.map((c) => `<div class="course"><i>🎓</i><div><b>${esc(c[0])}</b><small>${esc(c[1])}</small></div></div>`).join("")}</div>` : "";
  const chips = m.chips && m === lastAI() ? `<div class="chips">${m.chips.map((c) => `<button class="chip" type="button" data-say="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : "";
  return `<div class="m a"><span class="mk" aria-hidden="true"></span><div class="tx">${paras}${courses}${chips}</div></div>`;
}
function lastAI() { for (let i = W.msgs.length - 1; i >= 0; i--) if (W.msgs[i].who === "a") return W.msgs[i]; return null; }

function wCardHTML(m) {
  if (m.kind === "contact") {
    if (W.contact === "done") return `<div class="wcard"><b>Thanks, ${esc(W.cname || "Priya")}!</b><p>We've saved your details. We'll send a summary of this conversation to <b style="color:var(--fg)">${esc(W.cemail || "priya.sharma@example.com")}</b> once you're done here.</p></div>`;
    if (W.contact === "skipped") return `<div class="sysline">You can share your details any time — just ask</div>`;
    const e = W.cerr || {};
    return `<div class="wcard"><b>Want a summary of this chat?</b><p>Leave your name and email and I'll send you a summary of the courses and requirements we've covered. No account needed.</p>
      <input class="input ${e.name ? "err" : ""}" id="cName" placeholder="Your name" aria-label="Your name" value="${esc(W.cname || "")}">${e.name ? `<span class="errtxt">${e.name}</span>` : ""}
      <input class="input ${e.email ? "err" : ""}" id="cEmail" type="email" placeholder="Email address" aria-label="Email address" value="${esc(W.cemail || "")}">${e.email ? `<span class="errtxt">${e.email}</span>` : ""}
      <div class="rowb"><button class="btn sm pri" type="button" id="cSave" style="background:var(--brand);border-color:var(--brand)">${W.csaving ? "Sending…" : "Email me a summary"}</button><button class="btn sm ghost" type="button" id="cSkip" style="flex:0">Not now</button></div></div>`;
  }
  if (m.kind === "end") {
    if (W.ended) return `<div class="wcard"><b>Thanks for chatting!</b><p>${W.contact === "done" ? `A summary of everything we discussed is on its way to <b style="color:var(--fg)">${esc(W.cemail || "priya.sharma@example.com")}</b>. ` : ""}Ask me anything else whenever you like.</p></div>${ratingHTML()}`;
    return `<div class="wcard"><b>Anything else I can help with?</b><p>We covered the MSc Data Science entry requirements, IELTS 6.5 and the Global Futures scholarship. I can end the chat and email you a summary.</p>

  return "";
}

function ratingHTML() {
  if (W.ratingDone) return `<div class="wcard" style="align-items:center;text-align:center"><div style="font-size:26px">${RATINGS[W.rating][0]}</div><b>Thanks for your feedback!</b><p>${W.rating <= 2 ? "The team will look at what went wrong." : "It helps us make the assistant better."}</p></div>`;

let mountWidget = () => {};
function renderWidget() {
  const host = $("#wHost"); if (!host) return;
  const hadFocus = document.activeElement?.id === "wIn";
  const layer = $(".w-layer", host); const html = widgetHTML(host.dataset.opts ? JSON.parse(host.dataset.opts) : {});
  const t = document.createElement("div"); t.innerHTML = html; layer.replaceWith(t.firstElementChild);
  const inp = $("#wIn"); const body = $("#wBody");
  if (body) body.scrollTop = body.scrollHeight;
  if (inp && hadFocus) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  mountWidget();
  if (window.onWidgetChange) window.onWidgetChange();
}

function bindWidget() {
  const host = $("#wHost"); if (!host) return;
  host.onclick = (e) => {
    const t = e.target.closest("[data-w],[data-say],[data-retry],[data-rate],#rSend,#wSend,#cSave,#cSkip,#eEnd,#eCont"); if (!t) return;
    const w = t.dataset.w;
    if (w === "toggle") { W.open = !W.open; W.teaser = false; if (W.open) W.unread = 0; if (!W.open) W.full = false; }
    else if (w === "open") { W.open = true; W.teaser = false; W.unread = 0; }
    else if (w === "noteaser") { e.stopPropagation(); W.teaser = false; }
    else if (w === "min") { W.open = false; W.full = false; }
    else if (w === "full") { W.full = !W.full; }
    else if (t.dataset.say) { visitorSend(t.dataset.say); return; }
    else if (t.dataset.retry) { const m = W.msgs.find((x) => x.id === +t.dataset.retry); if (m) { m.state = "sending"; renderWidget(); setTimeout(() => { m.state = null; renderWidget(); respond(m.text); }, 700); } return; }
    else if (t.dataset.rate) { W.rating = +t.dataset.rate; }
    else if (t.id === "rSend") { W.ratingDone = true; toast(`Rated ${RATINGS[W.rating][0]} ${RATINGS[W.rating][1]}`); }
    else if (t.id === "wSend") { visitorSend(W.draft); return; }
    else if (t.id === "cSave") { submitContact(); return; }
    else if (t.id === "cSkip") { W.contact = "skipped"; }
    else if (t.id === "eEnd") { endChat(); return; }
    else if (t.id === "eCont") { W.msgs = W.msgs.filter((m) => m.kind !== "end"); W.endShown = true; W.msgs.push(M("a", "Of course — what else would you like to know?")); }
    renderWidget();
  };
  host.oninput = (e) => {
    if (e.target.id === "wIn") { W.draft = e.target.value; const b = $("#wSend"); if (b) b.disabled = !W.draft.trim(); }
    if (e.target.id === "cName") W.cname = e.target.value;
    if (e.target.id === "cEmail") W.cemail = e.target.value;
    if (e.target.id === "rNote") W.ratingNote = e.target.value;
  };
  host.onkeydown = (e) => {
    if (e.target.id === "wIn" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); visitorSend(W.draft); }
    if (e.target.id === "cEmail" && e.key === "Enter") submitContact();
  };
}

function visitorSend(text) {
  text = (text || "").trim(); if (!text) return;
  W.draft = ""; W.returning = false;
  if (W.ended) { W.ended = false; W.msgs = W.msgs.filter((m) => m.kind !== "end"); W.msgs.push(M("sys", "New conversation")); }
  const m = M("u", text, { state: "sending" }); W.msgs.push(m); W.sent++;
  renderWidget();
  const gen = W.gen;
  setTimeout(() => {
    if (gen !== W.gen) return;
    if (W.offline) { m.state = "failed"; renderWidget(); return; }
    m.state = null; renderWidget(); respond(text);
  }, 450);
}

function aiSay(msg, delay = 1300, steps = ["Searching Northfield's courses…"]) {
  const gen = W.gen;
  W.typing = steps[0]; renderWidget();
  let i = 0; const stepT = setInterval(() => { if (gen !== W.gen) return clearInterval(stepT); i++; if (steps[i]) { W.typing = steps[i]; renderWidget(); } }, 650);
  setTimeout(() => {
    clearInterval(stepT); if (gen !== W.gen) return; W.typing = null;
    const full = msg.text; const out = M("a", "", { chips: msg.chips, courses: null }); W.msgs.push(out);
    const words = full.split(" "); let n = 0;
    const tick = setInterval(() => {
      if (gen !== W.gen) return clearInterval(tick);
      n += 3; out.text = words.slice(0, n).join(" ");
      if (n >= words.length) { clearInterval(tick); out.text = full; out.courses = msg.courses || null; if (!W.open) W.unread++; renderWidget(); msg.after && msg.after(); return; }
      renderWidget();
    }, 45);
  }, delay);
}

const RULES = [
  { re: /human|person|agent|someone|talk to|speak to|real/i, fn: requestHuman },
  { re: /thank|bye|that'?s all|that is all|done/i, fn: () => aiSay({ text: "You're welcome! I'm glad I could help.", after: showEndCard }, 900, ["Wrapping up…"]) },
  { re: /master|course|program|degree|study/i, fn: () => aiSay({ text: "Here are three Masters courses international students ask about most. All three take **February and July** intakes:", courses: [["MSc Data Science", "18 months · On campus · £21,500/yr"], ["MSc Computer Science", "12 months · On campus · £20,900/yr"], ["MBA (Global)", "15 months · Blended · £24,000/yr"]], chips: ["Entry requirements for Data Science", "Are there scholarships?"], after: maybeContact }, 1500, ["Searching Northfield's courses…", "Checking intakes…"]) },
  { re: /ielts|english|toefl|pte|requirement/i, fn: () => aiSay({ text: "For the **MSc Data Science** you need an IELTS overall of **6.5**, with no band below 6.0. PTE Academic 62 or TOEFL iBT 90 are also accepted.\nYou'll also need a 2:1 bachelor's (or equivalent) in a quantitative subject.", chips: ["What if my writing band is 6.0?", "How do I apply?"], after: maybeContact }, 1300, ["Reading entry requirements…"]) },
  { re: /scholar|fund|fee|cost|money|price/i, fn: () => aiSay({ text: "International applicants are automatically considered for the **Global Futures Scholarship** — up to 50% off tuition for strong academic records. There's no separate form.", chips: ["How is it decided?", "How do I apply?"], after: maybeContact }, 1300, ["Looking up scholarships…"]) },
  { re: /apply|deadline|when/i, fn: () => aiSay({ text: "Applications for the **July intake** close on **30 April**. You apply online in about 20 minutes; you'll need transcripts, your IELTS result and a personal statement.", chips: ["What documents do I need?"], after: maybeContact }) },
];
function respond(text) {
  if (W.mode === "human" || W.mode === "waiting") { if (window.onVisitorToAgent) window.onVisitorToAgent(text); return; }
  const rule = RULES.find((r) => r.re.test(text));
  if (rule) rule.fn(text);
  else aiSay({ text: "Good question. I can help with courses, entry requirements, fees and scholarships at Northfield — could you tell me which programme you're interested in?", chips: CFG.starters.slice(0, 2), after: maybeContact });
}
function maybeContact() {
  if (W.contact === "none" && W.sent >= CFG.contactAfter) { W.contact = "shown"; W.msgs.push(M("card", "", { kind: "contact" })); renderWidget(); }
}
function submitContact() {
  const n = (W.cname || "").trim(), em = (W.cemail || "").trim(); const err = {};
  if (!n) err.name = "Enter your name";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) err.email = "Enter a valid email address";
  W.cerr = err; if (Object.keys(err).length) { renderWidget(); return; }
  W.csaving = true; renderWidget();
  const gen = W.gen;
  setTimeout(() => {
    if (gen !== W.gen) return; W.csaving = false; W.contact = "done"; renderWidget(); toast("Lead created · Visitors & Leads"); if (window.onLead) window.onLead(); }, 900);
}
function requestHuman() {
  if (!CFG.handoff) { aiSay({ text: "I can't connect you to a person from this chat, but you can email admissions@northfield.edu and the team will reply within a working day." }); return; }
  aiSay({ text: "Of course. I've asked the admissions team to join — they'll see our whole conversation, so you won't need to repeat anything.", after: () => { W.mode = "waiting"; W.msgs.push(M("card", "", { kind: "waiting" })); renderWidget(); if (window.onHandoffRequested) window.onHandoffRequested(); } }, 1000, ["Letting the team know…"]);
}
function showEndCard() { if (W.endShown) return; W.endShown = true; W.msgs.push(M("card", "", { kind: "end" })); renderWidget(); }
function endChat() { W.ended = true; renderWidget(); toast(W.contact === "done" ? "Chat ended · summary email queued" : "Chat ended"); if (window.onEnded) window.onEnded(); }

/* agent actions (Inbox side) */
function agentJoin() {
  W.mode = "human"; W.msgs = W.msgs.filter((m) => m.kind !== "waiting"); W.msgs.push(M("sys", `${AGENT.first} from the admissions team joined`)); renderWidget();
}
function agentSend(text) {
  if (W.mode !== "human") agentJoin();
  W.agentTyping = true; renderWidget();
  const gen = W.gen;
  setTimeout(() => { if (gen !== W.gen) return; W.agentTyping = false; W.msgs.push(M("g", text)); if (!W.open) W.unread++; renderWidget(); }, 1100);
}
function agentHandBack() {
  W.mode = "ai"; W.msgs.push(M("sys", "The AI assistant is back — ask me anything")); renderWidget();
}

/* ============ Inbox (staff side, mirrors W) ============ */
function inboxThreadHTML(opts = {}) {

    : st === "human" ? `<div class="tstrip h">You're handling this chat, so the AI is paused. It takes over again 15 minutes after your last reply.</div>`
    : `<div class="tstrip ai">The AI assistant is answering this visitor. Replying or clicking Take over pauses it.</div>`;
  const runs = W.msgs.filter((m) => ["u", "a", "g", "sys"].includes(m.who)).map((m) => {

    if (m.who === "g") return `<div class="run r"><div class="rh">${m.at} · <b>${AGENT.name}</b> · Team</div><div class="rb"><div class="av sm agent">${AGENT.ini}</div><div class="tb ag">${esc(m.text)}</div></div></div>`;
    return `<div class="run r"><div class="rh">${m.at} · <b class="ai">AI Assistant</b></div><div class="rb"><span class="orbmk"></span><div class="tb ai">${m.text.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>") || "…"}</div></div></div>`;
  }).join("");
  const ban = st === "human" ? `<div class="tban h">✋ Replies go to Priya's chat window on northfield.edu within a few seconds.</div>` : `<div class="tban ai">🤖 AI is handling this conversation. Sending a reply takes it over.</div>`;
  return `<div class="pane" style="border-right:${opts.panel ? "1px solid var(--border)" : "0"}">
    <div class="thead"><div class="av">PS<span class="bdg" style="background:var(--primary)">💬</span></div><div class="who"><b>${esc(W.cname || "Priya Sharma")}</b> <span class="pill p-ok" style="font-size:10px">Lead</span><small>via Web widget · ${esc(W.cemail || "priya.sharma@example.com")}</small></div><span class="sp"></span>${pill}${btns}<button class="btn sm" type="button" data-i="resolve">✓ Resolve</button></div>
    ${strip}<div class="tbody" id="tBody">${runs}</div>
    <div class="tcomp">${ban}<div class="tbox"><textarea id="aIn" placeholder="Reply to Priya… (Enter to send, Shift+Enter for a new line)" aria-label="Reply"></textarea><div class="tools"><b>B</b><i>I</i><span>•≡</span><span>😊</span><span>📎 Attach</span><span class="sp"></span><button class="btn sm pri" type="button" data-i="send">Send</button></div></div></div></div>`;
}
function renderInbox() {
  const host = $("#iHost"); if (!host) return;
  const old = $("#aIn"); const draft = old ? old.value : ""; const hadFocus = document.activeElement === old;
  host.innerHTML = inboxThreadHTML(); const b = $("#tBody"); if (b) b.scrollTop = b.scrollHeight;
  const ta = $("#aIn"); if (ta) { ta.value = draft; if (hadFocus) ta.focus(); }
}
function bindInbox() {
  const host = $("#iHost"); if (!host) return;
  host.onclick = (e) => {
    const t = e.target.closest("[data-i]"); if (!t) return;
    const a = t.dataset.i;
    if (a === "take") { agentJoin(); toast("You took over · the AI is paused"); }
    if (a === "back") { agentHandBack(); toast("Handed back to the AI"); }
    if (a === "resolve") { W.mode = "ai"; toast("Resolved · the AI answers if Priya writes again"); renderWidget(); }
    if (a === "send") { const v = $("#aIn").value.trim(); if (!v) return; agentSend(v); $("#aIn").value = ""; }
    renderInbox();
  };
  host.onkeydown = (e) => { if (e.target.id === "aIn" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); const v = e.target.value.trim(); if (!v) return; agentSend(v); e.target.value = ""; renderInbox(); } };
}

function bindWizard() {
  const stage = $("#stage");
  stage.oninput = (e) => {
    const id = e.target.id;
    if (id === "fName") CFG.name = e.target.value || "AI Counsellor";
    if (id === "fSub") CFG.subtitle = e.target.value;
    if (id === "fGreet") CFG.greeting = e.target.value;
    if (id === "fIns") CFG.instructions = e.target.value;
    if (id === "fColor") { CFG.brand = e.target.value; applyBrand(); }
  };
  stage.onchange = (e) => {
    if (e.target.name === "pos") { CFG.position = e.target.value; rerender(); }
    if (e.target.id === "fCa") CFG.contactAfter = +e.target.value;
  };
  stage.onclick = (e) => {
    const t = e.target.closest("#moreBtn,#fHand,#createBtn,#copy,#chk,[data-tab]"); if (!t) return;
    if (t.id === "moreBtn") { moreOpen = !moreOpen; rerender(); }
    if (t.id === "fHand") { CFG.handoff = !CFG.handoff; rerender(); }
    if (t.id === "createBtn") { toast("Widget created"); go(SC.findIndex((x) => x.id === "install")); }
    if (t.id === "copy") { copied = true; rerender(); toast("Embed code copied"); setTimeout(() => { copied = false; if (cur().id === "install") rerender(); }, 2000); }
    if (t.id === "chk") { checkState = "running"; rerender(); setTimeout(() => { checkState = "found"; if (cur().id === "install") rerender(); toast("Widget found on your website"); }, 1800); }
    if (t.dataset.tab) { installTab = t.dataset.tab; rerender(); }
  };
}

    ["Widget switched off (Inbox)", "p-warn", `<div class="card" style="padding:0;overflow:hidden"><div style="background:var(--warn-soft);color:var(--warn);padding:8px 12px;font-size:12px">The chat widget is off. It's hidden on your website and visitors can't send messages. Past conversations stay here.</div><div style="padding:10px 12px;font-size:12px">Toast: “Chat widget turned off” · <u>Undo</u></div></div>`, "Built. Turning it off also stops chats a person has taken over."],

    ["Snippet not found", "p-warn", `<div class="checkrow"><span class="pill p-warn">Not seen yet</span><span style="font-size:12px">We haven't seen the widget on northfield.edu. Check the code is before &lt;/body&gt; and the site is published.</span></div>`, "Planned. The installation check fails."],
    ["Key regenerated", "p-bad", `<div class="card" style="padding:12px;font-size:12px"><b>Old snippet stops working. Continue?</b><div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm pri" type="button">Yes, regenerate</button><button class="btn sm" type="button">No</button></div></div>`, "Today. After this, sites with the old key show the unavailable panel."],
  ];
  return `<div class="gallery">${cards.map(([t, p, b, f]) => `<div class="gcard"><div class="gh"><b>${t}</b><span class="pill ${p}">${p === "p-bad" ? "Error" : p === "p-warn" ? "Warning" : p === "p-h" ? "Team" : "State"}</span></div><div class="gb">${b}</div><div class="gf">${f}</div></div>`).join("")}</div>`;
}

function gapsPage() {
  const g = [
    ["Handover and staffing", [
      ["h", "Visitor-initiated handover isn't in the backend plan yet. It needs intent detection, a “wants a person” state, an Inbox flag, and a notification to staff."],
      ["h", "Nobody is notified when a chat wants a person. Decide: Inbox badge, email or push, and to whom."],
      ["m", "Office hours: what the visitor sees when the team is offline, and whether handover is offered at all."],
      ["m", "Agent typing indicator and the “You're chatting with a person” banner in the widget (needs the widget poll)."],
      ["l", "Canned replies and templates for common questions."],
    ]],
    ["Widget reliability", [
      ["h", "A dropped stream can leave an empty AI bubble or a spinner that never stops (the widget never aborts). Add a timeout, abort and “Try again”."],
      ["m", "Offline and reconnect handling: keep drafts and unsent messages and retry them."],
      ["m", "Paused, limit-reached and revoked-key panels with a fallback contact, instead of a raw error."],
      ["l", "Domain allow-list, so the key can't be reused on someone else's site."],
    ]],
    ["Privacy and consent", [
      ["h", "The summary email has no unsubscribe and the contact card has no privacy notice. Add consent wording and a privacy-policy link setting."],
      ["m", "Data retention for anonymous visitors, and deleting a visitor on request."],
      ["l", "An “AI can make mistakes” disclaimer is shown. Confirm the wording with legal."],
    ]],
    ["Setup and ops", [
      ["m", "The installation check, so a business knows the widget is actually live."],
      ["m", "Usage alerts at 80% and 100% of the monthly limit."],
      ["m", "Permissions: who can edit, pause or regenerate the widget, and who can reply."],
      ["m", "Chat rating needs storage (one rating and an optional comment per conversation), and a place to see low scores: an Inbox filter or an alert."],
      ["l", "Analytics: conversations, leads, takeovers and time to first human reply."],
      ["l", "Average chat rating over time, split by AI-only chats and chats a person took over."],
      ["l", "Multi-language greetings and answers."],
    ]],
  ];
  return `<div class="gaps">${g.map(([t, items]) => `<div class="card"><h3 class="serif" style="font-size:17px">${t}</h3><ul>${items.map(([p, x]) => `<li><b class="pri-${p}">${p === "h" ? "High" : p === "m" ? "Medium" : "Low"}</b> · ${x}</li>`).join("")}</ul></div>`).join("")}</div>`;
}

/* ============ render + navigation ============ */
function notesHTML(s) {
  const list = (a) => a.length ? `<ul>${a.map((x) => `<li>${x}</li>`).join("")}</ul>` : `<p style="color:var(--muted-fg)">—</p>`;
  return `<span class="label">${at + 1} of ${SC.length} · ${s.grp}</span><h2>${s.title}</h2><p>${s.what}</p>
    ${s.tryit ? `<div class="try"><b>Try it:</b> ${s.tryit}</div>` : ""}
    ${s.today.length || s.planned.length ? `<h4>Exists today</h4>${list(s.today)}<h4>Planned</h4>${list(s.planned)}` : ""}`;
}
function stepsHTML() {
  return SC.map((s, i) => `<button class="step ${i === at ? "on" : i < at ? "done" : ""}" type="button" data-step="${i}" aria-current="${i === at ? "step" : "false"}"><b>${i < at ? "✓" : i + 1}</b><span>${s.label}</span><span class="grp">${s.grp}</span></button>`).join("");
}
function rerender() {
  const s = cur();
  window.onWidgetChange = null; window.onVisitorToAgent = null; window.onEnded = null; window.onLead = null;
  const stage = $("#stage"); stage.onclick = stage.oninput = stage.onchange = null;
  let html = s.render();
  if (s.extra) html += `<div class="email" id="emailPrev" hidden><div class="eh">📧 To: priya.sharma@example.com · From: ${esc(CFG.name)} · “Your conversation with Northfield University”</div><div class="eb"><b class="serif" style="font-size:18px">Here's what we covered, Priya</b><ul style="margin:0;padding-left:18px"><li>MSc Data Science: 18 months, February and July intakes</li><li>Entry: IELTS 6.5 overall, no band below 6.0 (your 6.0 writing is fine)</li><li>Global Futures Scholarship: considered automatically</li></ul><p><b>Next step:</b> apply for July by 30 April.</p><p style="font-size:11px;color:var(--muted-fg)">Sent because you asked for a summary in the chat.</p></div></div>`;
  $("#stage").innerHTML = html;
  $("#notes").innerHTML = notesHTML(s);
  $("#steps").innerHTML = stepsHTML();
  $("#prev").disabled = at === 0; $("#next").disabled = at === SC.length - 1;
  mountWidget = bindWidget; bindWidget();
  const b = $("#wBody"); if (b) b.scrollTop = b.scrollHeight;
  s.after && s.after();
  $(".step.on")?.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
}
function go(i) {
  if (i < 0 || i >= SC.length) return;
  at = i; const s = cur(); if (s.pre) s.pre(); rerender(); window.scrollTo({ top: 0, behavior: "smooth" });
}
document.addEventListener("click", (e) => {
  const st = e.target.closest("[data-step]"); if (st) { go(+st.dataset.step); return; }
  const g = e.target.closest("[data-go]"); if (g && g.dataset.go) { const i = SC.findIndex((s) => s.id === g.dataset.go); if (i >= 0) { go(i); return; } }
  const t = e.target.closest("[data-toast]"); if (t) toast(t.dataset.toast);
});
$("#prev").onclick = () => go(at - 1);
$("#next").onclick = () => go(at + 1);
$("#restart").onclick = () => { Object.assign(CFG, { brand: "#7a1f2b", position: "right", handoff: true, contactAfter: 2 }); applyBrand(); go(0); };
document.addEventListener("keydown", (e) => {
  if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
  if (e.key === "ArrowRight") go(at + 1);
  if (e.key === "ArrowLeft") go(at - 1);
});
applyBrand();
go(0);
})();
</script>
</body>
</html>
